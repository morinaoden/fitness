name: Sync Strava Activity Data

on:
  schedule:
    - cron: "0 23 * * *"  # 08:00 JST daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch running + workout data from Strava
        id: sync
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python3 scripts/sync_strava.py

      - name: Commit data/running.json and data/workouts.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/running.json data/workouts.json data/.strava_sync_state.json; then
            git add data/running.json data/workouts.json data/.strava_sync_state.json
            git commit -m "Sync Strava activity data"
            git push
          else
            echo "No change in activity data"
          fi

      # Strava invalidates the previous refresh_token on every use, so the
      # new one must be saved back as the repo secret or the next run fails.
      # Reuses the same fine-grained PAT as the Withings workflow
      # (WITHINGS_GH_PAT, scoped to this repo with "Secrets: Read and write").
      - name: Persist rotated refresh_token
        env:
          GH_TOKEN: ${{ secrets.WITHINGS_GH_PAT }}
        run: |
          gh secret set STRAVA_REFRESH_TOKEN --body "${{ steps.sync.outputs.new_refresh_token }}" --repo "${{ github.repository }}"
