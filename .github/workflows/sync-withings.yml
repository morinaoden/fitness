name: Sync Withings Weight

on:
  schedule:
    - cron: "0 21 * * *"  # 06:00 JST daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch weight data from Withings
        id: sync
        env:
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          WITHINGS_REFRESH_TOKEN: ${{ secrets.WITHINGS_REFRESH_TOKEN }}
        run: python3 scripts/sync_withings.py

      - name: Commit data/weight.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/weight.json data/.sync_state.json; then
            git add data/weight.json data/.sync_state.json
            git commit -m "Sync Withings weight data"
            git push
          else
            echo "No change in weight data"
          fi

      # Withings invalidates the previous refresh_token on every use, so the
      # new one must be saved back as the repo secret or the next run fails.
      # Requires a repo secret WITHINGS_GH_PAT: a fine-grained PAT scoped to
      # this repository only, with "Secrets: Read and write" permission.
      - name: Persist rotated refresh_token
        env:
          GH_TOKEN: ${{ secrets.WITHINGS_GH_PAT }}
        run: |
          gh secret set WITHINGS_REFRESH_TOKEN --body "${{ steps.sync.outputs.new_refresh_token }}" --repo "${{ github.repository }}"

      # Mirrors data/weight.json to a Google Sheet so it can be referenced
      # as a live knowledge source (e.g. a claude.ai Project's Google Drive
      # connector). Skipped until GOOGLE_SHEET_ID / GOOGLE_SERVICE_ACCOUNT_KEY
      # secrets are configured. Requires the sheet to be shared with the
      # service account's email as Editor.
      - name: Push data to Google Sheet
        if: ${{ secrets.GOOGLE_SHEET_ID != '' }}
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          pip install --quiet google-api-python-client google-auth
          python3 scripts/update_sheet.py
